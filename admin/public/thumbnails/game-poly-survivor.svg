<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="arenaBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="65%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Cyber Grid Arena -->
  <rect width="800" height="450" fill="url(#arenaBg)"/>

  <!-- Perspective-style Isometric Floor Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1.5">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="165" x2="800" y2="165"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="315" x2="800" y2="315"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="120" y1="0" x2="40" y2="450"/>
    <line x1="260" y1="0" x2="210" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="540" y1="0" x2="590" y2="450"/>
    <line x1="680" y1="0" x2="760" y2="450"/>
  </g>

  <!-- Fire Orbital Ring Track -->
  <ellipse cx="400" cy="242" rx="118" ry="68" stroke="#F97316" stroke-opacity="0.38" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Cyan Magic Multi-Shot Bolts -->
  <g stroke="#38BDF8" stroke-width="5" stroke-linecap="round">
    <line x1="425" y1="220" x2="520" y2="165"/>
    <line x1="430" y1="232" x2="542" y2="212"/>
    <line x1="425" y1="244" x2="528" y2="258"/>
  </g>

  <!-- Glowing XP Gems on Floor -->
  <g fill="#22D3EE">
    <polygon points="295,180 303,190 295,200 287,190"/>
    <polygon points="342,332 350,342 342,352 334,342"/>
    <polygon points="485,318 493,328 485,338 477,328"/>
  </g>

  <!-- Swarming Low-Poly Enemies -->
  <!-- Red Cylinders -->
  <g transform="translate(195, 168)">
    <ellipse cx="0" cy="24" rx="22" ry="10" fill="#020617" opacity="0.6"/>
    <rect x="-16" y="-16" width="32" height="38" rx="8" fill="#EF4444"/>
    <ellipse cx="0" cy="-16" rx="16" ry="7" fill="#F87171"/>
  </g>
  <g transform="translate(155, 275)">
    <ellipse cx="0" cy="24" rx="22" ry="10" fill="#020617" opacity="0.6"/>
    <rect x="-16" y="-16" width="32" height="38" rx="8" fill="#EF4444"/>
    <ellipse cx="0" cy="-16" rx="16" ry="7" fill="#F87171"/>
  </g>
  <!-- Hit-Flashed White Enemy! -->
  <g transform="translate(555, 152)">
    <ellipse cx="0" cy="24" rx="24" ry="10" fill="#020617" opacity="0.6"/>
    <rect x="-17" y="-17" width="34" height="40" rx="8" fill="#FFFFFF"/>
  </g>

  <!-- Orange Speed Cones -->
  <g transform="translate(245, 338)">
    <ellipse cx="0" cy="20" rx="20" ry="9" fill="#020617" opacity="0.6"/>
    <polygon points="-18,18 18,18 0,-24" fill="#F59E0B"/>
  </g>
  <g transform="translate(615, 295)">
    <ellipse cx="0" cy="20" rx="20" ry="9" fill="#020617" opacity="0.6"/>
    <polygon points="-18,18 18,18 0,-24" fill="#F59E0B"/>
  </g>

  <!-- Purple Brute & Giant Crimson Boss -->
  <g transform="translate(658, 178)">
    <ellipse cx="0" cy="44" rx="46" ry="18" fill="#020617" opacity="0.7"/>
    <polygon points="0,-48 42,-16 28,38 -28,38 -42,-16" fill="#E11D48" stroke="#FDA4AF" stroke-width="2.5"/>
  </g>

  <!-- Zigzag Lightning Strike -->
  <polyline points="215,12 192,62 224,96 188,142 202,168" stroke="#FEF08A" stroke-width="5" stroke-linejoin="round" fill="none"/>
  <polyline points="215,12 192,62 224,96 188,142 202,168" stroke="#FFFFFF" stroke-width="2" fill="none"/>

  <!-- Glowing Fire Orbitals -->
  <circle cx="282" cy="242" r="24" fill="url(#fireGlow)"/>
  <circle cx="518" cy="242" r="24" fill="url(#fireGlow)"/>

  <!-- Central Low-Poly Mage Hero -->
  <g transform="translate(400, 232)">
    <ellipse cx="0" cy="28" rx="34" ry="14" fill="#020617" opacity="0.65"/>
    <ellipse cx="0" cy="28" rx="38" ry="16" stroke="#38BDF8" stroke-width="3" fill="none"/>
    <rect x="-18" y="-12" width="36" height="38" rx="8" fill="#0284C7"/>
    <circle cx="0" cy="-22" r="14" fill="#FEF3C7"/>
    <polygon points="-24,-28 24,-28 0,-68" fill="#2563EB"/>
  </g>
</svg>
