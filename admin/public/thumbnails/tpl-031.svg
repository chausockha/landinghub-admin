      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="0">
