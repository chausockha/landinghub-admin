      <stop offset="38%" stop-color="#f43f5e"/>
      <stop offset="68%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="waveArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#ec4899" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090d24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="riskArc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow31" x="-20%" y="-20%" width="140%" height="140%">
